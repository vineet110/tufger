; Tufger API settings you can tweak without touching code.
; Edit, commit and push: Vercel redeploys and the new values apply.
;
; NO SECRETS HERE. This file is in git. DATABASE_URL, SECRET_KEY, ADMIN_PASSCODE and
; TUFGER_KEY stay in Vercel → Settings → Environment Variables (and .env locally).
;
; Any value can be overridden for one environment with an env var named
; TUFGER_<SECTION>_<KEY>, e.g. TUFGER_LOGGING_LEVEL=DEBUG.

[logging]
; Lowest level printed to stdout (shows in Vercel → Logs). DEBUG | INFO | WARNING | ERROR
level = INFO
; Lowest level also saved to the app_logs table (Settings → Logs in the admin panel)
db_level = INFO
; Save logs to the database at all
db_enabled = true
; Saved logs older than this are deleted on start-up
retention_days = 30
; One log line per API call (method, path, status, time taken)
log_requests = true
; GET calls that don't crash (2xx-4xx) are logged at DEBUG: the pay page polls every 15 s, and an open
; tab on a deleted booking 404s each time, so INFO/WARNING would flood the table. 5xx is always ERROR.
quiet_gets = true
; Paths never logged as requests (comma separated, after /api/py)
skip_paths = /health

[auth]
; How long a login lasts
token_ttl_days = 30
; Wrong tries on one account before it locks, and for how long
max_failed_logins = 5
lock_minutes = 10
; Wrong tries from one network before it is blocked, and for how long
network_max_fails = 10
network_window_minutes = 15
